<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
  <defs>
    <linearGradient id="fintechGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <style>
      .bg { fill: #050b14; rx: 4px; stroke: #1a2736; stroke-width: 2px; }
      .sys-text { fill: #4a6b8c; font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; }
      .status-ok { fill: #00e676; font-family: 'Courier New', monospace; font-size: 13px; }
      .dot { fill: #00e676; animation: pulse 1.5s infinite; }
      .prompt { fill: #00f0ff; font-family: 'Courier New', monospace; font-size: 22px; font-weight: bold; }
      .typing { fill: #e2f1ff; font-family: 'Courier New', monospace; font-size: 22px; text-shadow: 0 0 5px rgba(226, 241, 255, 0.3); }
      .cursor { fill: #00f0ff; font-family: 'Courier New', monospace; font-size: 22px; animation: blink 1s step-end infinite; }
      .log { fill: #6b8aab; font-family: 'Courier New', monospace; font-size: 13px; }
      .log-hl { fill: #00e676; }
      .metric { fill: #4a6b8c; font-family: 'Courier New', monospace; font-size: 12px; }
      .metric-val { fill: #00f0ff; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
  </defs>

  <rect class="bg" width="796" height="246" x="2" y="2" />
  
  <!-- Top Bar -->
  <rect x="2" y="2" width="796" height="35" fill="#0a121e" rx="4" />
  <text x="20" y="24" class="sys-text">CORE // AMMAN_JO [MODULYNX_NODE]</text>
  <text x="400" y="24" class="sys-text" text-anchor="middle">MAHMOUD BARJOUS - Founder @Modulynx</text>
  
  <!-- Network Status -->
  <text x="740" y="24" class="status-ok" text-anchor="end">NETWORK: SECURE</text>
  <circle cx="770" cy="19" r="5" class="dot" />
  
  <!-- Left Logs (Investor Value Proposition) -->
  <text x="30" y="75" class="log">[sys] Enterprise-grade infrastructure... <tspan class="log-hl">DEPLOYED</tspan></text>
  <text x="30" y="100" class="log">[sys] Automated compliance &amp; ledger audit... <tspan class="log-hl">VERIFIED</tspan></text>
  <text x="30" y="125" class="log">[ops] AI-integrated operational pipelines... <tspan class="log-hl">ACTIVE</tspan></text>
  
  <!-- Right Metrics (Enterprise/Investor Metrics) -->
  <text x="770" y="75" class="metric" text-anchor="end">RELIABILITY: <tspan class="metric-val">99.999%</tspan></text>
  <text x="770" y="100" class="metric" text-anchor="end">SECURITY: <tspan class="metric-val">BANK-GRADE</tspan></text>
  <text x="770" y="125" class="metric" text-anchor="end">SCALABILITY: <tspan class="metric-val">ELASTIC</tspan></text>
  
  <!-- Active Typing Line -->
  <text x="30" y="180" class="prompt">&gt;</text>
  <g>
    <clipPath id="type-clip">
      <rect x="55" y="155" height="35" width="0">
        <animate attributeName="width" from="0" to="720" dur="2.5s" fill="freeze" begin="0.5s" />
      </rect>
    </clipPath>
    <text x="55" y="180" class="typing" clip-path="url(#type-clip)">Architecting Investment-Ready FinTech Systems</text>
    <text x="55" y="180" class="cursor">
      <animate attributeName="x" from="55" to="695" dur="2.5s" fill="freeze" begin="0.5s" />
      _
    </text>
  </g>
  
  <!-- Bottom Status Bar -->
  <text x="30" y="225" class="sys-text">CORE_STACK: <tspan class="status-ok">Python · n8n · Docker · GLM · Supabase</tspan></text>
  <text x="770" y="225" class="sys-text" text-anchor="end">CAPACITY: AUTO-SCALING</text>
  
  <!-- Bottom Gradient Line -->
  <rect x="2" y="244" width="796" height="4" fill="url(#fintechGrad)" />
</svg>
